<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knomee adoption demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root {
  /* One light world on purpose: the knomee-demo palette. Layout: a demo bar on top,
     the ACME advisor dashboard as a live viewport on the left, the journey notes on the right. */
  --plum: #240446;
  --plum-hover: #34105e;
  --grape: #7639a1;
  --orchid: #a855d6;
  --lilac: #e9d9f4;
  --plum-wash: #f7f2fc;
  --navy: #1c3f6e;
  --ink: #1a1a1a;
  --ink-soft: #333333;
  --slate: #757575;
  --muted: #6a7282;
  --ash: #afafaf;
  --stone: #cccccc;
  --line: #e8e8e8;
  --cloud: #fafafa;
  --pearl: #eeeeee;
  --green: #009966;
  --teal: #3dbdaa;
  --tag: #ffd66b;
  --tag-ink: #4a3300;
  --tag-edge: #e0a800;
  --notes-bg: #f6f4f9;
  --font: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --ic-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { color-scheme: light; background: var(--notes-bg); }
body { font-family: var(--font); background: var(--notes-bg); color: var(--ink); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--grape); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Demo bar ---------- */
.demobar { flex: none; height: 56px; background: #14022a; color: #fff; display: flex; align-items: center; gap: 20px; padding: 0 16px 0 20px; }
.demobar .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.demobar .brand svg { width: 22px; height: 22px; color: #fff; flex: none; }
.demobar .brand b { font-weight: 600; font-size: 14px; white-space: nowrap; }
.demobar .brand span { font-size: 13px; color: #bfb3d1; white-space: nowrap; }
.demobar .now { flex: 1; min-width: 0; text-align: center; font-size: 13px; color: #d9d0e6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demobar .now b { color: #fff; font-weight: 600; }
.demobar .ctrls { display: flex; align-items: center; gap: 8px; }
.db-btn { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid #4a3666; background: transparent; color: #fff; font-size: 13px; font-weight: 500; }
.db-btn:hover { background: #2a1247; }
.db-btn.primary { background: #fff; color: var(--plum); border-color: #fff; font-weight: 600; }
.db-btn.primary:hover { background: #efe7f8; }
.db-btn[disabled] { opacity: .4; cursor: default; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #d9d0e6; margin-right: 8px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 32px; height: 18px; border-radius: 9px; background: #4a3666; position: relative; transition: background .2s; }
.switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked + .track { background: var(--tag-edge); }
.switch input:checked + .track::after { transform: translateX(14px); }
.switch input:focus-visible + .track { outline: 2px solid #fff; outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .db-btn.pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,214,107,.0); } 50% { box-shadow: 0 0 0 6px rgba(255,214,107,.55); } }
}

/* ---------- Stage ---------- */
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 370px; }
.device { position: relative; overflow: hidden; background: #fff; border-right: 1px solid #ddd8e4; }
.app-scroll { position: absolute; inset: 0; overflow: auto; }
/* The dashboard is drawn at 86% so the full knomee-demo table fits beside the notes, as it does at 1440 px. */
.app-zoom { zoom: .86; min-height: 100%; }
.notes { overflow: auto; padding: 20px 18px 40px; }
@media (max-width: 1100px) {
  html, body { height: auto; }
  .stage { display: block; }
  .device { height: 760px; border-right: 0; border-bottom: 1px solid #ddd8e4; }
  .demobar .brand span, .demobar .now { display: none; }
}

/* ---------- ACME dashboard (the knomee-demo look) ---------- */
/* One centered column, as knomee-demo's --content-max: the top bar's ends, the tabs, banners and the page all sit on it. */
.col { width: 100%; max-width: 1440px; margin: 0 auto; padding-left: 40px; padding-right: 40px; }
.topbar { position: sticky; top: 0; z-index: 20; height: 64px; background: var(--navy); }
.topbar-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; }
.acme { font-family: Georgia, 'Times New Roman', serif; font-size: 30px; letter-spacing: 7px; color: #fff; }
.burger { width: 28px; height: 28px; color: #fff; }
.tabs { margin: 0; height: 52px; background: #fff; box-shadow: 0 6px 10px -6px rgba(36,4,70,.2); position: relative; z-index: 5; }
.tabs-inner { height: 100%; display: flex; align-items: stretch; }
.tabs-inner .tab:first-child { padding-left: 0; }
.tabs-inner .tab:first-child.active::after { left: 0; }
.tabs-inner .tab:last-child { padding-right: 0; }
.tab { display: flex; align-items: center; gap: 8px; padding: 0 22px; font-size: 16px; color: var(--slate); position: relative; background: none; border: 0; }
.tab svg { width: 16px; height: 16px; }
.tab.active { color: var(--plum); font-weight: 600; }
.tab.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px; background: var(--plum); }
.tab.right { margin-left: auto; }
.content { max-width: 1440px; margin: 0 auto; padding: 0 40px 96px; }
.page-title { font-size: 32px; font-weight: 600; color: var(--plum); letter-spacing: -.5px; margin: 32px 0 20px; }
.card { border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.04); margin-bottom: 24px; overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--cloud); border-bottom: 1px solid var(--line); }
.card.collapsed .card-head { border-bottom: 0; }
.card-title { display: flex; align-items: center; gap: 11px; font-size: 18px; font-weight: 600; color: var(--ink); }
.ico-circle { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; color: var(--grape); flex: none; }
.ico-circle svg { width: 16px; height: 16px; }
.help { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--stone); color: var(--slate); font-size: 10px; display: grid; place-items: center; font-weight: 600; }
.show-toggle { font-size: 11px; letter-spacing: .8px; font-weight: 600; color: var(--slate); text-transform: uppercase; display: flex; align-items: center; gap: 6px; padding-right: 8px; }
.metrics-body { padding: 20px 24px; display: grid; grid-template-columns: 200px 200px minmax(0, 1fr); gap: 24px; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; min-height: 160px; display: flex; flex-direction: column; }
.tile-label { font-size: 11px; font-weight: 600; letter-spacing: .6px; color: var(--slate); text-transform: uppercase; }
.tile-value { font-size: 56px; font-weight: 700; text-align: center; margin: auto 0; font-variant-numeric: tabular-nums; color: #111; }
.tile-value.kq { color: var(--grape); }
.tile-value.empty { color: var(--ash); }
.tierbar { display: flex; gap: 2px; height: 32px; border-radius: 6px; overflow: hidden; margin-top: 16px; background: var(--pearl); }
.seg { display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 15px; min-width: 32px; }
.seg.t1 { background: var(--plum); } .seg.t2 { background: var(--grape); } .seg.t3 { background: var(--orchid); }
.tierbar.none { display: grid; place-items: center; color: var(--slate); font-size: 12px; font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; justify-content: space-between; margin-top: 10px; gap: 8px 12px; }
.legend > div > span { white-space: nowrap; }
.legend div { font-size: 12px; font-weight: 600; color: var(--ink); display: flex; flex-direction: column; gap: 2px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.legend small { font-size: 11px; color: var(--slate); font-weight: 600; }
.incomplete-note { font-size: 11px; color: var(--slate); font-weight: 600; margin-top: auto; padding-top: 14px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.search { width: 320px; height: 44px; border: 1px solid var(--stone); border-radius: 10px; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--ash); font-size: 14px; }
.search svg { width: 16px; height: 16px; }
.actions { display: flex; gap: 12px; }
.btn { height: 44px; padding: 0 22px; border-radius: 10px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--stone); background: #fff; color: var(--ash); }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--plum); color: #fff; border-color: var(--plum); }
.btn-primary:hover { background: var(--plum-hover); }
@media (prefers-reduced-motion: no-preference) { .btn.beckon { animation: beckon 1.6s ease-out infinite; } @keyframes beckon { 0% { box-shadow: 0 0 0 0 rgba(224,168,0,.7); } 70% { box-shadow: 0 0 0 12px rgba(224,168,0,0); } 100% { box-shadow: 0 0 0 0 rgba(224,168,0,0); } } }
.btn.beckon { outline: 2px solid var(--tag-edge); outline-offset: 3px; }
.btn-ghost { color: var(--plum); border-color: var(--stone); }
.btn-ghost:hover { background: var(--plum-wash); }
.table-card { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
table.prospects { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--ink-soft); table-layout: fixed; }
.prospects th { text-align: left; font-size: 13px; font-weight: 600; color: var(--ink-soft); padding: 14px 12px; background: #f3f3f3; }
.prospects td { padding: 12px; border-top: 1px solid var(--line); vertical-align: middle; }
.prospects .c-check { width: 48px; }
.prospects .c-name { width: 25%; }
.prospects .c-kq { width: 92px; }
.prospects .c-num { width: 96px; }
.prospects .c-sign { width: 116px; }
.prospects .c-bolt { width: 60px; }
.prospects .c-more { width: 40px; }
.box { width: 16px; height: 16px; border: 1.5px solid #9a9a9a; border-radius: 3px; display: inline-block; vertical-align: middle; }
.band td { padding: 14px 20px; background: var(--plum); color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; border-top: 0; }
.band.t2 td { background: var(--grape); }
.band.inc td { background: var(--pearl); color: var(--slate); }
.band .count { display: inline-block; margin-left: 10px; padding: 1px 8px; border-radius: 10px; background: rgba(255,255,255,.18); font-size: 11px; }
.band.inc .count { background: #dcdcdc; }
.band .range { float: right; letter-spacing: .3px; }
.who-cell { display: flex; align-items: center; gap: 12px; min-width: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--lilac); color: var(--grape); display: grid; place-items: center; font-weight: 600; font-size: 16px; flex: none; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--line); }
.who-cell .nm { color: var(--plum); font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.who-cell .em { color: var(--ash); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-cell > div { min-width: 0; }
.new-tag { background: #c77dff; color: var(--plum); font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 6px; }
.kq-badge { width: 52px; height: 40px; border-radius: 8px; border: 2px solid var(--plum); display: grid; place-items: center; font-weight: 700; font-size: 17px; color: var(--plum); }
.kq-badge.t2 { border-color: var(--grape); color: var(--grape); }
.kq-badge.none { border-color: var(--pearl); color: var(--ash); background: var(--cloud); }
.status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--slate); }
.status-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--stone); }
.status-pill.progress i { background: var(--orchid); }
.bolt { width: 38px; height: 38px; border-radius: 9px; background: var(--plum); color: #fff; display: grid; place-items: center; border: 0; }
.bolt svg { width: 15px; height: 15px; }
.bolt.off { background: var(--pearl); color: var(--ash); }
.dots { color: var(--ash); font-size: 18px; letter-spacing: 1px; }
.row-new td { background: #fcf9ff; }
.empty-cell { padding: 48px 20px !important; text-align: center; }
.empty-cell .em-ico { width: 56px; height: 56px; border-radius: 50%; background: var(--plum-wash); color: var(--grape); display: grid; place-items: center; margin: 0 auto 14px; }
.empty-cell .em-ico svg { width: 24px; height: 24px; }
.empty-cell h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; color: var(--plum); }
.empty-cell p { margin: 0 auto 18px; max-width: 46ch; color: var(--slate); font-size: 14px; line-height: 1.55; }
.funnel { list-style: none; margin: auto 0; padding: 0; display: flex; align-items: flex-start; justify-content: center; gap: 6px; }
.funnel li { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; text-align: center; }
.funnel li + li::before { content: ''; position: absolute; left: -10px; top: 22px; width: 8px; height: 8px; border-top: 1.5px solid var(--ash); border-right: 1.5px solid var(--ash); transform: rotate(45deg); }
.funnel b { font-size: 44px; line-height: 1; font-weight: 700; color: #111; font-variant-numeric: tabular-nums; }
.funnel b.zero { color: var(--ash); }
.funnel span { font-size: 11.5px; font-weight: 600; color: var(--slate); line-height: 1.3; }
.cal-list { list-style: none; margin: 0; padding: 6px 24px; }
.cal-list li { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto 150px; align-items: center; gap: 14px; padding: 12px 0; }
.cal-list li + li { border-top: 1px solid var(--line); }
.cal-who b { display: block; font-size: 14.5px; font-weight: 500; color: var(--plum); }
.cal-who small { font-size: 12.5px; color: var(--ash); }
.cal-when { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.cal-when svg { width: 15px; height: 15px; color: var(--grape); }
.cal-btn { height: 36px; padding: 0 16px; font-size: 13.5px; justify-self: end; }
.cal-list .nudged { justify-self: end; }
@media (prefers-reduced-motion: no-preference) { .cal-card { animation: calIn .4s cubic-bezier(.2,.8,.2,1) both; } @keyframes calIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } } }
.tile-foot { margin-top: auto; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tile-foot .needs { margin-left: 0; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.tile-foot .nudge-btn { height: 30px; font-size: 12.5px; }
.ask-q { margin: 0; font-size: 18px; font-weight: 600; color: var(--plum); }
.ask-opts { display: flex; flex-direction: column; gap: 10px; }
.ask-opts .stuck-opt { justify-content: space-between; padding: 0 16px; }
.modal.ask .ic-grow { font-family: var(--font); margin: 0; }
.stuck { width: min(560px, 100%); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.stuck h3 { margin: 0; font-size: 18px; font-weight: 600; color: var(--plum); }
.stuck-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.stuck-opt { height: 46px; border-radius: 10px; border: 1px solid var(--stone); background: #fff; font-size: 14px; font-weight: 500; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; gap: 8px; }
.stuck-opt:hover { border-color: #b9a9cf; background: #fbfafc; }
.stuck-opt.sel { border-color: var(--plum); background: var(--plum-wash); color: var(--plum); font-weight: 600; }
.stuck-opt svg { width: 14px; height: 14px; }
.stuck-reply { margin: 0; font-size: 14px; color: var(--slate); }
.stuck .ic-grow { font-family: var(--font); margin: 0; }
.nudge-cell { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.nudge-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--plum); background: #fff; color: var(--plum); font-weight: 600; font-size: 13px; white-space: nowrap; }
.nudge-btn:hover { background: var(--plum-wash); }
.nudge-btn svg { width: 14px; height: 14px; }
.nudged { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-weight: 600; }
.nudged svg { width: 13px; height: 13px; }
.needs { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.needs i { width: 8px; height: 8px; border-radius: 50%; background: var(--orchid); }
.to-line { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--slate); }
.to-line b { display: block; color: var(--ink); font-weight: 600; font-size: 14px; }
.email-card textarea.grow { min-height: 80px; }
.locked-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; background: var(--cloud); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; }
.locked-bar .card-title { color: var(--slate); }
.locked-bar .lock { color: var(--ash); width: 16px; height: 16px; }
.search.off { background: var(--cloud); }
.btn.off { color: var(--ash); border-color: var(--line); cursor: default; }
.table-card.head-only { border: 0; border-radius: 14px; }
.table-card.head-only th { background: #eeeeee; }
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 20px 64px; gap: 22px; }
.empty-caption { margin: 0; font-size: 15px; font-weight: 500; color: var(--slate); }
.empty-cta { border: 0; border-radius: 999px; padding: 15px 32px; font-size: 16px; font-weight: 600; color: #fff; background: var(--plum); }
.empty-cta:hover { background: var(--plum-hover); box-shadow: 0 8px 20px rgba(36,4,70,.28); }
.empty-subtitle { margin: 0; max-width: 640px; font-size: 15px; font-weight: 600; line-height: 1.5; color: var(--plum); }
.empty-illus { position: relative; width: 200px; height: 150px; }
.illus-disc { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 116px; height: 116px; border-radius: 50%; background: #ecd9fb; }
.ill-chip { position: absolute; width: 46px; height: 46px; border-radius: 50%; background: #fff; box-shadow: 0 6px 16px rgba(16,24,40,.14); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.ic1 { left: 30px; top: 18px; } .ic2 { right: 34px; top: 6px; } .ic3 { right: 30px; bottom: 14px; } .ic4 { left: 40px; bottom: 8px; }
.ill-dot { position: absolute; width: 8px; height: 8px; border-radius: 2px; }
.ill-dot.d1 { left: 12px; top: 44px; background: #9b51e0; transform: rotate(20deg); }
.ill-dot.d2 { right: 8px; top: 40px; background: #086375; border-radius: 50%; }
.ill-dot.d3 { left: 84px; top: 0; background: #f59e0b; }
.ill-dot.d4 { right: 20px; bottom: 40px; background: #b98ddc; border-radius: 50%; }
.ill-dot.d5 { left: 22px; bottom: 30px; background: #e879f9; transform: rotate(-15deg); }
.pp-crumb { display: flex; align-items: center; gap: 8px; margin: 18px 0 14px; font-size: 13px; color: var(--slate); }
.pp-crumb button { background: none; border: 0; padding: 0; font: inherit; color: var(--slate); }
.pp-crumb button:hover { color: var(--plum); text-decoration: underline; }
.pp-crumb b { color: var(--plum); font-weight: 600; }
.app-zoom { display: flex; flex-direction: column; }
#dash { width: 100%; }
#dash.pp-on { flex: 1; display: flex; flex-direction: column; padding-bottom: 0; width: 100%; }
.pp { flex: 1; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: stretch; }
.pp-main { padding-bottom: 88px; min-width: 0; }
.pp-side { background: var(--cloud); border-radius: 12px 12px 0 0; }
.pp-side-in { position: sticky; top: 76px; padding: 20px 16px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
img.avatar { object-fit: cover; padding: 0; }
.avatar.pp-photo { width: 92px; height: 92px; }
.pp-side h2 { margin: 4px 0 0; font-size: 21px; color: var(--plum); font-weight: 600; }
.pp-meta { list-style: none; margin: 0; padding: 0; font-size: 12.5px; color: var(--slate); display: flex; flex-direction: column; gap: 4px; align-self: stretch; text-align: left; }

/* ---------- Intro screens (between steps) ---------- */
#intro-layer { position: absolute; inset: 0; z-index: 90; pointer-events: none; }
.intro { pointer-events: auto; position: absolute; inset: 0; background: #14022a; color: #fff; display: flex; align-items: center; justify-content: center; padding: 56px; }
.intro-inner { width: min(820px, 100%); display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
.tl2 { position: relative; width: 100%; height: 150px; margin-bottom: 18px; }
.tl2 .ln { position: absolute; height: 2px; background: rgba(255,255,255,.16); }
.tl2 .ln.side { height: 0; background: none; border-top: 2px dashed rgba(255,255,255,.2); }
.tl2 .vln { position: absolute; width: 0; border-left: 2px dashed rgba(255,255,255,.2); }
.tl2.side-on .ln.side, .tl2.side-on .vln { border-color: rgba(199,125,255,.6); }
.tl2 .cap { position: absolute; transform: translate(-50%, -50%); font-size: 12px; font-style: italic; color: #8f80a8; white-space: nowrap; }
.tl2 .nd { position: absolute; transform: translate(-50%, -50%); width: 18px; height: 18px; border-radius: 50%; background: #14022a; border: 2px solid rgba(255,255,255,.34); }
.tl2 .nd.side { border-style: dashed; }
.tl2 .nd.past { background: #7639a1; border-color: #7639a1; }
.tl2 .nd.side.past { background: #14022a; border-color: #7639a1; }
.tl2 .nd.on { background: #c77dff; border: 2px solid #c77dff; box-shadow: 0 0 0 6px rgba(199,125,255,.22); }
.tl2 .lb { position: absolute; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 1px; white-space: nowrap; }
.tl2 .lb b { font-size: 13px; font-weight: 600; color: #a99cbd; }
.tl2 .lb span { font-size: 11.5px; color: #7f7096; }
.tl2 .lb.on b { color: #fff; }
.tl2 .lb.on span { color: #cdc1de; }
.itl { list-style: none; margin: 0 0 34px; padding: 0; display: flex; width: 100%; }
.itl li { position: relative; flex: 1; display: flex; flex-direction: column; gap: 3px; padding-top: 28px; min-width: 0; }
.itl li:last-child { flex: 0 0 auto; }
.itl li::after { content: ''; position: absolute; top: 8px; left: 22px; right: 6px; height: 2px; border-radius: 1px; background: rgba(255,255,255,.14); }
.itl li:last-child::after { display: none; }
.itl li.past::after { background: #7639a1; }
.itl li.br::after, .itl li.br + li::before { }
.itl li i { position: absolute; top: 0; left: 0; width: 18px; height: 18px; border-radius: 50%; background: #14022a; border: 2px solid rgba(255,255,255,.32); }
.itl li.past i { background: #7639a1; border-color: #7639a1; }
.itl li.on i { background: #c77dff; border-color: #c77dff; box-shadow: 0 0 0 6px rgba(199,125,255,.22); }
.itl li.br i { border-style: dashed; }
.itl li.br.past i { background: transparent; border-color: #7639a1; }
.itl b { font-size: 14px; font-weight: 600; color: #b3a6c6; white-space: nowrap; }
.itl span { font-size: 12px; color: #7f7096; white-space: nowrap; }
.itl li.on b { color: #fff; }
.itl li.on span { color: #cdc1de; }
.intro-pill { font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: rgba(233,217,244,.1); border: 1px solid rgba(233,217,244,.28); color: #e9d9f4; }
.intro.branch .intro-pill { border-style: dashed; }
.intro h2 { margin: 0 0 6px; font-size: 58px; line-height: 1.05; font-weight: 600; letter-spacing: -1.4px; color: #fff; text-wrap: balance; }
.intro.branch h2 { font-size: 46px; }
.moments { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 14px; width: 100%; }
.moments li { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 18px; align-items: baseline; }
.moments span { font-size: 14px; font-weight: 600; color: #c77dff; }
.moments p { margin: 0; font-size: 19px; line-height: 1.45; color: #e6def0; max-width: 46ch; }
.intro-go { height: 50px; padding: 0 24px; border-radius: 999px; border: 0; background: #fff; color: var(--plum); font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; }
.intro-go:hover { background: #efe5f8; }
.intro-go svg { width: 18px; height: 18px; }
.intro-go:focus-visible { outline: 2px solid #c77dff; outline-offset: 3px; }
.intro-mark { position: absolute; left: 40px; bottom: 28px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #8f80a8; }
.intro-mark svg { width: 18px; height: 18px; color: #8f80a8; }
@media (prefers-reduced-motion: no-preference) {
  .intro { animation: introIn .45s ease both; }
  .intro-inner > * { animation: introUp .5s ease both; }
  .intro-inner > *:nth-child(2) { animation-delay: .06s; }
  .intro-inner > *:nth-child(3) { animation-delay: .12s; }
  .intro-inner > *:nth-child(4) { animation-delay: .18s; }
  .intro-inner > *:nth-child(5) { animation-delay: .24s; }
  @keyframes introIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes introUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
}

/* ---------- Email viewer (from the notes) ---------- */
#mail-layer { position: fixed; inset: 0; z-index: 200; pointer-events: none; }

.mail-av { flex: none; width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #7639a1, #2dd2b0); color: #fff; font-size: 14px; font-weight: 700; display: grid; place-items: center; }

/* ---------- Motion and micro-interactions ---------- */
[data-action="noop"] { cursor: default; pointer-events: none; }
.btn, .ic-btn, .nudge-btn, .empty-cta, .intro-go, .db-btn, .stuck-opt, .ic-opt, .pp-convert, .tl-btn, .mini.mail, .linkbtn, .nm-btn, .ic-close, .x, .mail-x, .notif {

  var PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';

  function sender() { return '<div class="ic-sender">' + FIRM_AV + '<div><b>Acme Advisors</b></div></div>'; }

  /* ---------------- Dashboard ---------------- */
  /* The knomee-demo's own empty dashboard (demo controls > Empty state): locked bars,
     a header-only table, and the illustrated invitation to try the prospect experience. */
  var LOCK = '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  /* Day 14 with no invites: the empty dashboard asks what's in the way, in place of the illustration. */
  function stuckCard() {
    var st = S.ui.stuck, a = st.answer;
    var h = '<div class="stuck"><h3>What’s in the way?</h3><div class="stuck-opts">' +
      ['No meetings yet', 'Not sure what to say', 'Might bother clients', 'Other'].map(function (o, i) {
        return '<button class="stuck-opt' + (i === a ? ' sel' : '') + '" type="button" aria-pressed="' + (i === a) + '" data-action="stuck-answer" data-i="' + i + '">' + o + (i === a ? ICON.check : '') + '</button>';
      }).join('') + '</div>';
    if (a === 0) h += '<p class="stuck-reply">We’ll check back next week.</p>';
    if (a === 1) h += '<button class="empty-cta" type="button" data-action="open-note">See the email</button>';
    if (a === 2) h += '<button class="empty-cta" type="button" data-action="open-sample">See what clients see</button>';
    if (a === 3) h += st.sentText ? '<p class="stuck-reply">We’ll call you.</p>' :
      '<textarea id="stuck-text" class="ic-grow" placeholder="Tell us more" aria-label="Tell us more">' + esc(st.text || '') + '</textarea><button class="empty-cta" type="button" data-action="stuck-send">Send</button>';
    return h + '</div></div>';
  }
  function emptyDash() {
    var h = '<h2 class="page-title">My Prospects</h2>';

      case 'cal-connect': busy(el, function () { leave(['.ic-post', '.ic-post-scrim'], $('ic-layer'), function () { ui.post = null; ui.cal = { sent: {} }; renderDash(); renderOverlays(); toast('Calendar connected'); }); }, 'Connected'); break;
      case 'cal-send':
        var ci = +el.getAttribute('data-i'), m = CAL_MEETS[ci];
        if (!ui.cal || ui.cal.sent[ci]) break;
        busy(el, function () {
          ui.cal.sent[ci] = true; ui.done = true;
          S.prospects.forEach(function (p) { p.isNew = false; });
          S.prospects.push({ id: 'cal' + ci, name: m.name, email: m.email, status: 'invited', sign: 'Invited 12/14', action: 'Invited', isNew: true });
          var keep = $('app-scroll').scrollTop;
          renderDash(); renderOverlays(); $('app-scroll').scrollTop = keep;
          toast('Check-in sent to ' + m.name.split(' ')[0] + '.');
        }); break;
      default: break;
    }
  });

  document.addEventListener('input', function (ev) {
    var nf = ev.target.getAttribute && ev.target.getAttribute('data-nfield');
    if (nf && S.ui.nudge && S.ui.nudge.draft) { S.ui.nudge.draft[nf] = ev.target.value; if (nf === 'body') autosize(ev.target); return; }
    if (ev.target.classList && ev.target.classList.contains('ic-grow')) {
      autosize(ev.target);
      if (ev.target.id === 'survey-text' && S.ui.survey) S.ui.survey.details = ev.target.value;
      if (ev.target.id === 'stuck-text' && S.ui.stuck) S.ui.stuck.text = ev.target.value;
      if (ev.target.id === 'ask-text' && S.ui.ask) S.ui.ask.text = ev.target.value;
      return;
    }
    var f = ev.target.getAttribute && ev.target.getAttribute('data-field');
    if (!f || !S.ui.invite) return;
    S.ui.invite[f] = ev.target.value;
    if (f === 'body') autosize(ev.target);
    if (f === 'name') {
      var d = S.ui.invite, first = firstName(ev.target.value), head = 'Hi ' + d.greet + ',';
      if (d.body.indexOf(head) === 0) {
        d.body = 'Hi ' + first + ',' + d.body.slice(head.length);
        d.greet = first;
        var ta = $('np-body'); if (ta) { ta.value = d.body; autosize(ta); }
      }
    }
  });

  document.addEventListener('keydown', function (ev) {
    var t = ev.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA') {
      if (ev.key === 'Enter' && S.ui.modal === 'invite' && t === 'INPUT') { ev.preventDefault(); sendInvite(false); }
      return;
    }
    if (S.mail && ev.key === 'Escape') { S.mail = null; renderMail(); return; }
    if (S.intro) {
      if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'ArrowRight' || ev.key === 'Escape') { ev.preventDefault(); closeIntro(); }
      if (ev.key === 'ArrowLeft') goTo(S.step - 1);
      return;
    }
    if (ev.key === 'Escape') {
      if (S.ui.modal) { S.ui.modal = null; renderOverlays(); }
      else if (S.ui.drawer) { S.ui.drawer = false; renderDash(); renderOverlays(); }
      return;
    }
    if (ev.key === 'ArrowRight') { goTo(S.step + 1); }
    if (ev.key === 'ArrowLeft') { goTo(S.step - 1); }
  });

  $('labels-toggle').addEventListener('change', function (ev) { document.body.classList.toggle('labels-on', ev.target.checked); });
  $('intro-toggle').addEventListener('change', function (ev) { introsOn = ev.target.checked; if (!introsOn && S.intro) closeIntro(); });
  $('app-scroll').addEventListener('scroll', placeTip, { passive: true });
  window.addEventListener('resize', placeTip);
  window.addEventListener('hashchange', function () {
    var id = location.hash.replace('#', '');
    var i = STEPS.findIndex(function (s) { return s.id === id; });
    if (i > -1 && i !== S.step) goTo(i, true);
  });

  /* ---------------- Motion ----------------
     Entrances play once: every re-render remembers which overlays were already on screen and keeps those still,
     so only what is new animates. Closing plays a short exit, sending shows a short "sending" state, and a new
     step or day lays the page in from the top. Everything here is skipped when the viewer prefers reduced motion. */
  var AK_SEL = '.ic-launcher,.modal,.scrim,.mail-win,.mail-scrim,.toast,.ic-post,.ic-post-scrim,.ic-checklist,.ic-tip,.ic-survey,.ic-chat,.ic-banner,.ic-reply,.ic-follow,.stuck-reply,.tl-detail,.sk,.notif,.tierbar,.cal-card,.empty-state,.stuck,.pp,.pp-crumb,.badge,.err,.intro';
  var STG_SEL = ['#dash > *', '.metrics-body > .tile', '.funnel li', '.legend > div', '.prospects tbody tr', '.cal-list li', '.pp-card', '.words span', '.ptag',
    '.ic-opts .ic-opt', '.ask-opts .stuck-opt', '.stuck-opts .stuck-opt', '.moments li', '.tl2 .nd', '.tl2 .lb', '.sk-msgs .sk-m', '.mail-body > *', '.empty-state > *'];
  function akey(e) {
    var c = typeof e.className === 'string' ? e.className.replace(/\b(still|leaving|ok|busy)\b/g, '').replace(/\s+/g, ' ').trim() : '';
    return S.step + '|' + e.tagName + '|' + c + '|' + (e.id || '') + (/\btoast\b/.test(c) ? '|' + e.textContent : '');
  }
  function stagger(root) {
    STG_SEL.forEach(function (sel) {
      var count = new Map();
      Array.prototype.forEach.call(root.querySelectorAll(sel), function (e) {
        var n = count.get(e.parentNode) || 0; count.set(e.parentNode, n + 1);
        e.style.setProperty('--i', n);
      });
    });
  }
  function watchRenders() {
    var desc = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
    ['dash', 'banner-slot', 'product-layer', 'ic-layer', 'notes', 'mail-layer', 'chat-layer', 'intro-layer'].forEach(function (id) {
      var node = $(id); if (!node) return;
      Object.defineProperty(node, 'innerHTML', {
        configurable: true,
        get: function () { return desc.get.call(node); },
        set: function (html) {
          var seen = {};
          Array.prototype.forEach.call(node.querySelectorAll(AK_SEL), function (e) { if (!e.classList.contains('leaving')) seen[akey(e)] = 1; });
          desc.set.call(node, html);
          Array.prototype.forEach.call(node.querySelectorAll(AK_SEL), function (e) { if (seen[akey(e)]) e.classList.add('still'); });
          stagger(node);
          ripples(node);
        }
      });
    });
  }
  /* Play an exit on what is closing, then run the state change. */
  function leave(sels, root, fn, ms) {
    var els = [];
    sels.forEach(function (s) { Array.prototype.forEach.call((root || document).querySelectorAll(s), function (e) { els.push(e); }); });
    if (REDUCED || !els.length) { fn(); return; }
    if (els.some(function (e) { return e.classList.contains('leaving'); })) return;
    var at = S.step;
    els.forEach(function (e) { e.classList.remove('still'); e.classList.add('leaving'); });
    setTimeout(function () { if (S.step === at) fn(); }, ms || 190);
  }
  /* A send button spins briefly, turns into a check, then the action lands. */
  function busy(el, fn, label) {
    if (!el || REDUCED) { fn(); return; }
    if (el.classList.contains('busy') || el.classList.contains('ok')) return;
    var at = S.step;
    el.style.minWidth = el.offsetWidth + 'px';
    el.classList.add('busy'); el.setAttribute('aria-busy', 'true');
    setTimeout(function () {
      if (S.step !== at) return;
      el.classList.remove('busy'); el.classList.add('ok'); el.removeAttribute('aria-busy');
      el.innerHTML = ICON.check + '<span>' + (label || 'Sent') + '</span>';
      setTimeout(function () { if (S.step === at) fn(); }, 340);
    }, 560);
  }
  /* A new step or day lays the page in from the top. */
  var enterTimer = null;
  function enterAnim() {
    if (REDUCED) return;
    var dv = $('device');
    dv.classList.remove('entering'); void dv.offsetWidth; dv.classList.add('entering');
    clearTimeout(enterTimer);
    enterTimer = setTimeout(function () { dv.classList.remove('entering'); }, 1400);
  }
  /* Press ripple on the buttons that do something. */
  var RIPPLE_SEL = '.btn-primary, .btn-ghost:not([data-action="noop"]), .ic-btn, .db-btn, .intro-go, .nudge-btn, button.mail-cta, .stuck-opt, .ic-opt, .notif';
  function ripples(root) {
    Array.prototype.forEach.call((root || document).querySelectorAll(RIPPLE_SEL), function (b) { b.classList.add('rp'); });
  }
  document.addEventListener('pointerdown', function (ev) {
    if (REDUCED) return;
    var b = ev.target.closest('.rp'); if (!b || b.disabled) return;
    var r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2;
    var s = document.createElement('span');
    s.className = 'ripple';
    s.style.width = s.style.height = d + 'px';
    s.style.left = (ev.clientX - r.left - d / 2) + 'px';
    s.style.top = (ev.clientY - r.top - d / 2) + 'px';
    b.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 650);
  }, true);
  /* Notes: the timeline fills up to the current step, and the effort counter counts up. */
  var notesPrev = { prog: 0, clicks: null };
  function animateNotes() {
    var tl = document.querySelector('#notes .tl'), cur = document.querySelector('#notes .tl-item.current');
    if (tl && cur) {
      var target = Math.max(0, cur.offsetTop + 3);
      tl.style.setProperty('--prog', notesPrev.prog + 'px');
      void tl.offsetWidth;
      tl.style.setProperty('--prog', target + 'px');
      notesPrev.prog = target;
    }
    var n = document.querySelector('#notes .effort .n');
    if (!n) return;
    var to = +n.textContent, from = notesPrev.clicks;
    notesPrev.clicks = to;
    if (from === null || from === to || REDUCED) return;
    var box = n.closest('.effort'), t0 = null;
    box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump');
    n.textContent = from;
    (function tick(t) {
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / 600), e = 1 - Math.pow(1 - k, 3);
      n.textContent = Math.round(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(tick);
    })(performance.now());
  }
  watchRenders();
  ripples(document);

  var startId = location.hash.replace('#', '');
  var startIdx = STEPS.findIndex(function (s) { return s.id === startId; });
  goTo(startIdx > -1 ? startIdx : 0, true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeTip);
})();
</script>
